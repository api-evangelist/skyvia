- name: Skyvia Automation Webhook Triggers
  description: >-
    Inbound webhook surface for Skyvia Automation. Each automation with a Webhook trigger is assigned a Skyvia-issued
    base URL plus a user-defined event name; an external application POSTs its event payload to that URL to start the
    automation in real time. Payloads may be authenticated with SHA256 HMAC hash verification against a shared secret
    key, with the signature carried in a configurable request header; requests whose signature does not match are
    rejected with "Invalid HMAC header value". Complemented by polling Connection triggers that watch a data source
    for new, updated or deleted records.
  humanURL: https://docs.skyvia.com/automation/building-automation/triggers.html
  baseURL: https://app.skyvia.com
