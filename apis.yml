- name: Skyvia Connect MCP Endpoint
  description: >-
    Hosted Model Context Protocol server that publishes any Skyvia connection — 200+ cloud apps and databases — as a
    set of MCP tools an AI assistant can call. Each customer endpoint is served from mcp.skyvia.com under its own
    endpoint id; the server advertises four tools (Instructions, Objects, ObjectInfo, Execute) that let an agent
    discover the objects behind the endpoint, read their metadata and relationships, and run parameterized SQL
    against the live data source. Optional endpoint security uses HTTP Basic user accounts plus IP allow-lists.
  humanURL: https://docs.skyvia.com/connect/mcp-endpoints/
  baseURL: https://mcp.skyvia.com
  tags:
  - MCP
  - agent-native
