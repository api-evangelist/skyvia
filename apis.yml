apis:
- name: Skyvia Public API
  description: >-
    REST management API for the Skyvia platform. Programmatically read and control account users and invitations,
    workspaces and workspace membership, on-premise agents, data-source connections, data integration packages and
    their executions and schedules, automations and their execution history, cloud backups and snapshots, and Skyvia
    Connect endpoints and their request logs. Authenticated with a scoped Skyvia API token passed in the
    Authorization header; tokens carry per-resource read/execute/modify scopes and cannot be issued for longer than
    one year.
