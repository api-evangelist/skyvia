- name: Skyvia Connect OData & SQL Endpoints
  description: >-
    Connectivity-as-a-service layer that exposes a Skyvia connection as a secured web API without writing code. An
    endpoint can be published as an OData v4 service (consumable from Power BI, Excel, Tableau and any OData client)
    or as a SQL endpoint, with per-endpoint user accounts, IP address filtering, per-object and per-operation
    permissions, and a full request log. Endpoints are served from connect.skyvia.com, or self-hosted on IIS via the
    Skyvia Agent under the hybrid deployment option.
  humanURL: https://docs.skyvia.com/connect/
  baseURL: https://connect.skyvia.com
