unmapped:
- scope: Automation / Execute
  reason: >-
    Documented as a token permission, but the v1 API publishes no operation that starts an automation —
    automations are started by their own trigger (manual, schedule, connection polling, or webhook). Recorded
    as published-but-unbound rather than mapped to a guess. Backup schedule enable/disable and snapshot
    creation, conversely, appear in the spec but are not named as a distinct Backup permission on the API
    Settings page.
gaps:
- The scope model is prose-only; no scope strings appear in the OpenAPI, so per-operation authorization is not machine-readable.
- No scope-to-operation table is published by Skyvia; the mapping above is derived by API Evangelist from resource names and is marked as such.
