summary: >-
  IMPORTANT: these are NOT OAuth 2.0 scopes. Skyvia runs no OAuth or OIDC. A Skyvia API token is an opaque
  bearer credential created in Account Settings > API Settings, and at creation time the user selects a set
  of per-resource permissions the token carries. Those permissions are the scope model recorded here. They
  are documented in prose on the API Settings page and appear nowhere in the OpenAPI document — the spec
  declares a single `Access Token` apiKey scheme with an empty scope list on every operation, so an agent
  reading only the spec cannot tell which token permission any operation needs. The mapping below is
  reconstructed from the documented permission names against the operations they govern.
