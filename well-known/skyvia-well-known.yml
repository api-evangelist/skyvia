summary: >-
  No Skyvia host serves any /.well-known/ discovery document. skyvia.com answers HTTP 200 for every
  /.well-known/* path, but the body is the 118KB marketing homepage HTML — a soft-404 catch-all, not a
  document, so every one of those 200s is recorded as a miss. api.skyvia.com rejects every unauthenticated
