paging_wrappers:
  pattern: '{Entity}DtoHasMorePagingDto'
  shape: '{ data: [Entity], hasMore: boolean }'
  count: 12
  note: Envelope types, not domain entities. See conventions/skyvia-conventions.yml.
observations:
- >-
  Foreign keys are absent from the DTOs almost everywhere; the hierarchy lives in the URL. A client that
  fetches an EndpointDto or IntegrationDto in isolation cannot tell which connection or workspace it belongs
  to without remembering the path it used.
- >-
  There is a clean four-level shape throughout: Account > Workspace > Asset > Run. Every executable asset
  (Integration, Automation, Backup) exposes the same run-history idiom with startDate/endDate/failed filters
  and a summary/detail DTO pair.
- >-
  Endpoint is the only entity that bridges to the data plane, and it is the one whose enum has fallen behind
  the product.
gaps:
- No connection id on EndpointDto or IntegrationDto, so the control-plane graph cannot be reassembled from responses alone.
- No global identifier scheme; ids are workspace-local int32.
- EndpointDto.type omits the MCP endpoint type shipped in the product.
