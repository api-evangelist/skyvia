summary: >-
  Entity-relationship graph of the Skyvia control plane, derived from the 45 schemas and 47 route templates
  in the published Swagger document. The model is strictly hierarchical and path-expressed: Account owns
  Workspaces, a Workspace owns every asset (Agents, Connections, Integrations, Automations, Backups,
  Endpoints), and each executable asset owns a run-history collection. Note that the DTOs themselves carry
  almost no foreign keys — parentage is encoded in the URL path (workspaceId is a path parameter on 44 of
  52 operations), not in the response bodies, so the graph below is read from the route hierarchy as much
  as from the schemas.
id_strategy:
  workspace: integer (int32)
  assets: integer (int32)
  note: >-
    Ids are plain 32-bit integers with no type prefixes and no GUIDs, so an id is only meaningful inside its
    workspace and resource type. There is no globally addressable identifier for any Skyvia object.
