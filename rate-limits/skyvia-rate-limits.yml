what_is_metered_instead:
  note: >-
    Skyvia meters subscription-level THROUGHPUT rather than request rate. These are real, published ceilings
    that an API or agent caller will hit, but they are billing quotas enforced per month or per day against
    the account, not per-request limits with a runtime signal. Captured in full in
    plans/skyvia-plans-pricing.yml.
  quotas:
  - product: Data Integration
    metric: records processed per month
    free: 10000
    paid: unlimited
    consumed_by: POST /v1/workspaces/{workspaceId}/integrations/{integrationId}/executions
  - product: Data Integration
    metric: minimum scheduling frequency
    free: once a day
    paid: once a day (Basic) / once hourly (Standard) / once per minute (Professional) / instant (Enterprise)
    note: >-
      This is the closest analogue to a rate limit on the platform — it caps how often a scheduled
      integration may run, by plan.
  - product: Automation
    metric: tasks per month
    free: 1000
    paid: unlimited
    consumed_by: webhook, schedule and connection triggers
  - product: Automation
    metric: minimum schedule interval
    free: 1 day
    paid: 1 minute
  - product: Query
    metric: queries per day
    free: 5
    paid: unlimited
  - product: Connect
    metric: traffic per month (bytes)
    free: 100 KB
    paid: 1 MB (Basic) / 100 MB (Standard) / 1 GB (Professional)
    consumed_by: OData endpoints, SQL endpoints, and MCP endpoint tool calls
    note: >-
      The binding constraint on the agent surface. Because it is measured in bytes rather than calls, the
      cost of an MCP Execute call scales with result-set size, and an unbounded query can exhaust a month's
      quota in one request.
  - product: Backup
    metric: storage
    free: 1 GB
    paid: 20 GB / 200 GB / 1 TB
connector_side_limits:
  note: >-
    Skyvia does throttle OUTBOUND requests to the third-party APIs it integrates with, to stay inside those
    vendors' limits — the August 2026 release note records rate-limit throttling added to the Cin7 Core
    Inventory connector "to regulate request frequency in compliance with the Cin7 Core Inventory API
    limits", and community threads discuss Salesforce Bulk API limits. That is Skyvia respecting other
    people's limits, not Skyvia publishing its own.
  evidence:
