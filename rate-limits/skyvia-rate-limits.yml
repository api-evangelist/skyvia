summary: >-
  Skyvia publishes NO per-request rate limit for any of its APIs, and NO rate-limit response headers. The
  API reference has no rate-limit section; the 52-operation Swagger document declares no 429 response and no
  headers on any response; and no RateLimit-*, X-RateLimit-* or Retry-After header was observed on live
  responses. An honest zero: a client has no runtime signal telling it how close it is to a ceiling, and no
  documented status code to back off on.
