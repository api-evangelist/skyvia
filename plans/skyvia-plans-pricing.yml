observations:
- >-
  Every product has a genuine free tier with no card required, so the entire surface — including a Connect
  endpoint and therefore an MCP endpoint — can be exercised at zero cost. The Connect free tier's 100 KB per
  month of traffic is the binding constraint on evaluating the agent surface.
- >-
  The Connect traffic quota is measured in bytes per month, not requests, which means an agent issuing SQL
  through the MCP Execute tool consumes quota in proportion to result-set size. A single unbounded SELECT can
  exhaust a Free or Basic plan.
- >-
  Hybrid deployment of the Connect runtime is not on the pricing page at all — the April 2026 release note
  states it is disabled by default and priced on request.
