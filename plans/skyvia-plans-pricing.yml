model: >-
  Skyvia prices each of its six products separately on the same account — a customer subscribes only to the
  products they use, and each product has its own free tier. Annual pricing is billed as an annual package
  at a lower effective monthly rate. Quotas are subscription-level throughput ceilings (records, tasks,
  storage, traffic, queries per day) rather than per-request API rate limits; see
  rate-limits/skyvia-rate-limits.yml.
api_access_note: >-
  The pricing page does not gate the Public REST API to any tier, and does not list API calls as a metered
  quantity on any plan. What the plans do meter is the work the API triggers — an integration run started
  through POST /integrations/{id}/executions consumes the Data Integration records quota, and an automation
  started by a webhook consumes the Automation tasks quota.
