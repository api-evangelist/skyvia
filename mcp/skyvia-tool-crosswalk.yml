  - GET /v1/workspaces/{workspaceId}
  - GET /v1/workspaces/{workspaceId}/users
  - POST /v1/workspaces/{workspaceId}/users
  - DELETE /v1/workspaces/{workspaceId}/users/{userId}
  reason: No MCP tool covers workspaces or membership.
