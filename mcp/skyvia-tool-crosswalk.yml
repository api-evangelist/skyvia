generated: '2026-08-12'
method: derived
source: mcp/skyvia-mcp.yml + openapi/*.yml
summary: >-
  Skyvia's MCP surface and its REST surface are NOT two projections of one data core — they are two
  different products. The MCP server (Skyvia Connect) reads and queries CUSTOMER DATA through a published
  endpoint; the Public REST API (api.skyvia.com) manages SKYVIA PLATFORM OBJECTS — workspaces, connections,
  integrations, automations, backups, endpoints. There is therefore almost no overlap to bind: every MCP
  tool is mcp_only, and every REST operation is rest_only. The one genuine seam is the Endpoints resource
  in REST, which administers the very endpoint the MCP server serves — but it administers it, it does not
  call it, and its own EndpointDto.type enum does not yet include MCP.
surfaces:
  openapi:
    files:
    - openapi/skyvia-account-api-openapi.yml
    - openapi/skyvia-agents-api-openapi.yml
    - openapi/skyvia-automations-api-openapi.yml
    - openapi/skyvia-backups-api-openapi.yml
    - openapi/skyvia-connections-api-openapi.yml
    - openapi/skyvia-endpoints-api-openapi.yml
    - openapi/skyvia-integrations-api-openapi.yml
    - openapi/skyvia-workspaces-api-openapi.yml
    original: openapi/_original/skyvia-public-api-openapi-original.json
    host: https://api.skyvia.com
    gated: true
    gate: Every request requires an Authorization API token; unauthenticated requests return 403.
    note: >-
      The published spec declares NO operationIds — every operation is identified here by METHOD + path.
      This is a real contract-quality gap, not an omission on our side.
  mcp:
    url: https://mcp.skyvia.com/mcp
    gated: false
    gate: >-
      tools/list answers anonymously; the DATA behind a customer endpoint is gated by that endpoint's
      optional HTTP Basic users and IP allow-list.
  graphql:
    present: false
    note: >-
      Skyvia ships a GraphQL CONNECTOR (a data source it can read from, added February 2026), but exposes
      no GraphQL API of its own.
  odata:
    url_form: https://connect.skyvia.com/{endpointId}
    gated: true
    note: >-
      Skyvia Connect OData v4 endpoints are per-customer and carry customer data; no public metadata
      document is reachable without an endpoint id and credentials.
crosswalk: []
mcp_only:
- tool: Instructions
  reason: >-
    Server-side self-documentation. No REST equivalent — the Public API has no operation that returns usage
    instructions.
- tool: Objects
  reason: >-
    Lists the objects (tables/views/cloud objects) behind a Connect endpoint. This is endpoint DATA-PLANE
    metadata served by connect/mcp.skyvia.com; the Public API's Endpoints resource exposes only the endpoint
    record itself (id, name, token, active, type, created, modified) and its request log, never the objects
    inside it.
- tool: ObjectInfo
  reason: >-
    Detailed field/relationship metadata for one endpoint object, including parent and child relations. No
    REST counterpart at any level of the Public API.
- tool: Execute
  reason: >-
    Runs parameterized SQL against the endpoint's underlying data source and returns paged results. The
    Public API is a control plane only — it has no data-read or query operation of any kind.
