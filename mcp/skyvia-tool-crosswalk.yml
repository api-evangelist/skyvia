  - POST /v1/workspaces/{workspaceId}/connections/{connectionId}/test
  reason: >-
    Closest conceptual neighbour to the MCP surface — a Connect endpoint is built on a connection — but the
    REST operations administer the connection record and test reachability; they never read through it.
- capability: Connect endpoints
  operations:
  - GET /v1/endpoints/types
  - GET /v1/workspaces/{workspaceId}/endpoints
  - GET /v1/workspaces/{workspaceId}/endpoints/{endpointId}
  - POST /v1/workspaces/{workspaceId}/endpoints/{endpointId}/enable
  - POST /v1/workspaces/{workspaceId}/endpoints/{endpointId}/disable
  - GET /v1/workspaces/{workspaceId}/endpoints/{endpointId}/executions
  - GET /v1/workspaces/{workspaceId}/endpoints/{endpointId}/executions/{recordId}
  reason: >-
    The administrative seam to the MCP/OData data plane: these operations enable, disable and audit the
    endpoint the MCP server fronts. EndpointDto.type enumerates only OData and Sql, so MCP endpoints are not
    yet addressable here.
- capability: Integrations
