  binding_rate: 0.0
  note: >-
    A binding rate of zero is the finding, not a failure of the crosswalk. Skyvia's agent surface reaches
    customer data and its API surface reaches the platform; an agent given the MCP endpoint can query the
    business data but cannot operate the pipelines that fill it, and an agent given an API token can operate
    every pipeline but cannot read a single row.
