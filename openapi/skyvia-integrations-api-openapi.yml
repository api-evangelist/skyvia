components:
  schemas:
    IntegrationExecutionLogDtoHasMorePagingDto:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/IntegrationExecutionLogDto'
        hasMore:
          type: boolean
      additionalProperties: false
    IntegrationExecutionLogDto:
      type: object
      properties:
        runId:
          type: integer
          format: int32
        date:
          type: string
          format: date-time
        duration:
          type: integer
          format: int32
        state:
          enum:
          - New
          - Queued
          - Running
          - Succeeded
          - Failed
          - Canceling
          - Canceled
          type: string
        successRows:
          type: integer
          format: int32
        errorRows:
          type: integer
          format: int32
      additionalProperties: false
    IntegrationDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
          description: 'Possible values: dataflow, export, controlflow, replication, import, sync, custom'
        created:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time
        scheduled:
          type: boolean
      additionalProperties: false
    IntegrationDtoHasMorePagingDto:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/IntegrationDto'
        hasMore:
          type: boolean
      additionalProperties: false
    IntegrationScheduleDto:
      type: object
      properties:
        active:
          type: boolean
      additionalProperties: false
    IntegrationExecutionResultDto:
      type: object
      properties:
        runId:
          type: integer
          format: int32
        queueTime:
          type: string
          format: date-time
        startTime:
          type:
          - string
          - 'null'
          format: date-time
        endTime:
          type:
          - string
          - 'null'
          format: date-time
        state:
          enum:
          - New
          - Queued
          - Running
          - Succeeded
          - Failed
          - Canceling
          - Canceled
          type: string
        result:
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    Access_Token:
      type: apiKey
      description: Authorization header with the Skyvia access token.
      name: Authorization
      in: header
