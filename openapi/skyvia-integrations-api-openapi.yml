            text/json:
              schema:
                $ref: '#/components/schemas/IntegrationExecutionLogDtoHasMorePagingDto'
      operationId: getV1WorkspacesByWorkspaceIdIntegrationsByIntegrationIdExecutions
      x-operation-id-source: derived
    post:
