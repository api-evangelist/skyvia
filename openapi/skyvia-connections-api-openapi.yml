openapi: 3.2.0
info:
  title: Skyvia public Connections API
  version: v1
security:
- Access Token: []
tags:
- name: Connections
paths:
  /v1/workspaces/{workspaceId}/connections:
    get:
      tags:
      - Connections
      summary: Get connections
      parameters:
      - name: workspaceId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: skip
        in: query
        description: Items to skip [0...]
        schema:
          type: integer
          format: int32
          default: 0
      - name: take
        in: query
        description: Items to take [1..200]
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ConnectionDtoHasMorePagingDto'
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionDtoHasMorePagingDto'
            text/json:
              schema:
                $ref: '#/components/schemas/ConnectionDtoHasMorePagingDto'
      operationId: getV1WorkspacesByWorkspaceIdConnections
      x-operation-id-source: derived
  /v1/workspaces/{workspaceId}/connections/{connectionId}:
    get:
      tags:
      - Connections
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: connectionId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ConnectionDetailsDto'
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionDetailsDto'
            text/json:
              schema:
                $ref: '#/components/schemas/ConnectionDetailsDto'
      summary: Get workspaces by workspace id connections by connection id
      x-summary-source: derived
      operationId: getV1WorkspacesByWorkspaceIdConnectionsByConnectionId
      x-operation-id-source: derived
  /v1/workspaces/{workspaceId}/connections/{connectionId}/test:
    post:
      tags:
      - Connections
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: connectionId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiResult'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
      summary: Create workspaces by workspace id connections by connection id test
      x-summary-source: derived
      operationId: postV1WorkspacesByWorkspaceIdConnectionsByConnectionIdTest
      x-operation-id-source: derived
components:
  schemas:
    ApiResult:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        refresh:
          type: boolean
      additionalProperties: false
    ConnectionDtoHasMorePagingDto:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ConnectionDto'
        hasMore:
          type: boolean
      additionalProperties: false
    ConnectionDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
        connector:
          type:
          - string
          - 'null'
      additionalProperties: false
    ConnectionDetailsDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
        connector:
          type:
          - string
          - 'null'
        type:
          enum:
          - Direct
          - Agent
          type: string
      additionalProperties: false
  securitySchemes:
    Access_Token:
      type: apiKey
      description: Authorization header with the Skyvia access token.
      name: Authorization
      in: header
