openapi: 3.2.0
info:
  title: Skyvia public Automations API
  version: v1
security:
- Access Token: []
tags:
- name: Automations
paths:
  /v1/workspaces/{workspaceId}/automations:
    get:
      tags:
      - Automations
      summary: Get automations
      parameters:
      - name: workspaceId
        in: path
        description: Workspace Id
        required: true
        schema:
          type: integer
          format: int32
      - name: skip
        in: query
        description: Items to skip [0...]
        schema:
          type: integer
          format: int32
          default: 0
      - name: take
        in: query
        description: Items to take [1..200]
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AutomationDtoHasMorePagingDto'
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationDtoHasMorePagingDto'
            text/json:
              schema:
                $ref: '#/components/schemas/AutomationDtoHasMorePagingDto'
      operationId: getV1WorkspacesByWorkspaceIdAutomations
      x-operation-id-source: derived
  /v1/workspaces/{workspaceId}/automations/{automationId}:
    get:
      tags:
      - Automations
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: automationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AutomationDto'
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationDto'
            text/json:
              schema:
                $ref: '#/components/schemas/AutomationDto'
      summary: Get workspaces by workspace id automations by automation id
      x-summary-source: derived
      operationId: getV1WorkspacesByWorkspaceIdAutomationsByAutomationId
      x-operation-id-source: derived
  /v1/workspaces/{workspaceId}/automations/{automationId}/executions:
    get:
      tags:
      - Automations
      summary: Get finished executions
      parameters:
      - name: workspaceId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: automationId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: startDate
        in: query
        description: ''
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        description: ''
        schema:
          type: string
          format: date-time
      - name: failed
        in: query
        description: ''
        schema:
          type: boolean
      - name: skip
        in: query
        description: Items to skip [0...]
        schema:
          type: integer
          format: int32
          default: 0
      - name: take
        in: query
        description: Items to take [1..200]
        schema:
          type: integer
          format: int32
          default: 20
      - name: sortOrder
        in: query
        description: 'To sort the available list of records in either ascending or descending order. Possible values: asc - ascending order, desc - descending order.The default value is ''asc''.'
        schema:
          type: string
          default: asc
      - name: sortBy
        in: query
        description: 'To sort the records based on the fields: date, executionId. The default value is ''date'''
        schema:
          type: string
          default: date
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AutomationLogItemDtoHasMorePagingDto'
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationLogItemDtoHasMorePagingDto'
            text/json:
              schema:
                $ref: '#/components/schemas/AutomationLogItemDtoHasMorePagingDto'
      operationId: getV1WorkspacesByWorkspaceIdAutomationsByAutomationIdExecutions
      x-operation-id-source: derived
  /v1/workspaces/{workspaceId}/automations/{automationId}/executions/{executionId}:
    get:
      tags:
      - Automations
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: automationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: executionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AutomationLogItemDetailsDto'
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationLogItemDetailsDto'
            text/json:
              schema:
                $ref: '#/components/schemas/AutomationLogItemDetailsDto'
      summary: Get workspaces by workspace id automations by automation id executions by…
      x-summary-source: derived
      operationId: getV1WorkspacesByWorkspaceIdAutomationsByAutomationIdExecutionsByExecutionId
      x-operation-id-source: derived
  /v1/workspaces/{workspaceId}/automations/{automationId}/state:
    get:
      tags:
      - Automations
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: automationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AutomationStateDto'
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationStateDto'
            text/json:
              schema:
                $ref: '#/components/schemas/AutomationStateDto'
      summary: Get workspaces by workspace id automations by automation id state
      x-summary-source: derived
      operationId: getV1WorkspacesByWorkspaceIdAutomationsByAutomationIdState
      x-operation-id-source: derived
  /v1/workspaces/{workspaceId}/automations/{automationId}/active:
    get:
      tags:
      - Automations
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: automationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AutomationExecutionStateDto'
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationExecutionStateDto'
            text/json:
              schema:
                $ref: '#/components/schemas/AutomationExecutionStateDto'
      summary: Get workspaces by workspace id automations by automation id active
      x-summary-source: derived
      operationId: getV1WorkspacesByWorkspaceIdAutomationsByAutomationIdActive
      x-operation-id-source: derived
  /v1/workspaces/{workspaceId}/automations/{automationId}/enable:
    post:
      tags:
      - Automations
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: automationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
      summary: Create workspaces by workspace id automations by automation id enable
      x-summary-source: derived
      operationId: postV1WorkspacesByWorkspaceIdAutomationsByAutomationIdEnable
      x-operation-id-source: derived
  /v1/workspaces/{workspaceId}/automations/{automationId}/disable:
    post:
      tags:
      - Automations
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: automationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
      summary: Create workspaces by workspace id automations by automation id disable
      x-summary-source: derived
      operationId: postV1WorkspacesByWorkspaceIdAutomationsByAutomationIdDisable
      x-operation-id-source: derived
components:
  schemas:
    AutomationLogItemDto:
      type: object
      properties:
        executionId:
          type: integer
          format: int64
        state:
          enum:
          - Executing
          - Succeeded
          - Failed
          - Canceling
          - Canceled
          - Killing
          type: string
        date:
          type: string
          format: date-time
        billedTasks:
          type: integer
          format: int64
        testMode:
          type: boolean
      additionalProperties: false
    AutomationDtoHasMorePagingDto:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AutomationDto'
        hasMore:
          type: boolean
      additionalProperties: false
    AutomationExecutionStateDto:
      type: object
      properties:
        executionId:
          type: integer
          format: int64
        date:
          type: string
          format: date-time
        state:
          type:
          - string
          - 'null'
        testMode:
          type: boolean
      additionalProperties: false
    AutomationStateDto:
      type: object
      properties:
        trigger:
          $ref: '#/components/schemas/AutomationTriggerStateDto'
        queue:
          $ref: '#/components/schemas/AutomationQueueStateDto'
        executing:
          $ref: '#/components/schemas/AutomationExecutionStateDto'
        testMode:
          type:
          - boolean
          - 'null'
      additionalProperties: false
    AutomationTriggerStateDto:
      type: object
      properties:
        enabled:
          type: boolean
      additionalProperties: false
    AutomationDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
        triggerType:
          enum:
          - Manual
          - Schedule
          - Connection
          - Webhook
          type: string
        created:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time
      additionalProperties: false
    AutomationQueueStateDto:
      type: object
      properties:
        queuedCount:
          type: integer
          format: int32
      additionalProperties: false
    AutomationLogItemDetailsDto:
      type: object
      properties:
        executionId:
          type: integer
          format: int64
        state:
          enum:
          - Executing
          - Succeeded
          - Failed
          - Canceling
          - Canceled
          - Killing
          type: string
        version:
          type: integer
          format: int32
        testMode:
          type: boolean
        comment:
          type:
          - string
          - 'null'
        started:
          type: string
          format: date-time
        executed:
          type:
          - string
          - 'null'
          format: date-time
        billedTasks:
          type:
          - integer
          - 'null'
          format: int32
        error:
          type:
          - string
          - 'null'
      additionalProperties: false
    AutomationLogItemDtoHasMorePagingDto:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AutomationLogItemDto'
        hasMore:
          type: boolean
      additionalProperties: false
  securitySchemes:
    Access_Token:
      type: apiKey
      description: Authorization header with the Skyvia access token.
      name: Authorization
      in: header
