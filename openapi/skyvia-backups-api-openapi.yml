components:
  schemas:
    BackupDtoHasMorePagingDto:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BackupDto'
        hasMore:
          type: boolean
      additionalProperties: false
    BackupSnapshotLogDto:
      type: object
      properties:
        snapshotId:
          type: integer
          format: int32
        queueTime:
          type:
          - string
          - 'null'
          format: date-time
        startTime:
          type:
          - string
          - 'null'
          format: date-time
        endTime:
          type:
          - string
          - 'null'
          format: date-time
        state:
          enum:
          - New
          - Queued
          - Running
          - Succeeded
          - Failed
          - Canceling
          - Canceled
          type: string
        runBySchedule:
          type: boolean
      additionalProperties: false
    BackupScheduleDto:
      type: object
      properties:
        active:
          type: boolean
      additionalProperties: false
    BackupActiveRunDto:
      type: object
      properties:
        runId:
          type: integer
          format: int32
        date:
          type: string
          format: date-time
        duration:
          type: integer
          format: int32
        state:
          enum:
          - New
          - Queued
          - Running
          - Succeeded
          - Failed
          - Canceling
          - Canceled
          type: string
      additionalProperties: false
    BackupSnapshotLogDtoHasMorePagingDto:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BackupSnapshotLogDto'
        hasMore:
          type: boolean
      additionalProperties: false
    BackupDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
        created:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time
        scheduled:
          type: boolean
      additionalProperties: false
    BackupSnapshotLogDetailsDto:
      type: object
      properties:
        snapshotId:
          type: integer
          format: int32
        queueTime:
          type:
          - string
          - 'null'
          format: date-time
        startTime:
          type:
          - string
          - 'null'
          format: date-time
        endTime:
          type:
          - string
          - 'null'
          format: date-time
        state:
          enum:
          - New
          - Queued
          - Running
          - Succeeded
          - Failed
          - Canceling
          - Canceled
          type: string
        runBySchedule:
          type: boolean
        result:
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    Access_Token:
      type: apiKey
      description: Authorization header with the Skyvia access token.
      name: Authorization
      in: header
