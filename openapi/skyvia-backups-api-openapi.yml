      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/BackupScheduleDto'
            application/json:
              schema:
                $ref: '#/components/schemas/BackupScheduleDto'
            text/json:
              schema:
                $ref: '#/components/schemas/BackupScheduleDto'
