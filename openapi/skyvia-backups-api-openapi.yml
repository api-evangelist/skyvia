      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/BackupScheduleDto'
            application/json:
              schema:
                $ref: '#/components/schemas/BackupScheduleDto'
            text/json:
              schema:
                $ref: '#/components/schemas/BackupScheduleDto'
      summary: Get workspaces by workspace id backups by backup id schedule
      x-summary-source: derived
      operationId: getV1WorkspacesByWorkspaceIdBackupsByBackupIdSchedule
      x-operation-id-source: derived
  /v1/workspaces/{workspaceId}/backups/{backupId}/schedule/enable:
    post:
      tags:
      - Backups
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: backupId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
