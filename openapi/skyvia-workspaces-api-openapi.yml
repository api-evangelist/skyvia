openapi: 3.2.0
info:
  title: Skyvia public Workspaces API
  version: v1
security:
- Access Token: []
tags:
- name: Workspaces
paths:
  /v1/workspaces:
    get:
      tags:
      - Workspaces
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceDto'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceDto'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceDto'
      summary: Get workspaces
      x-summary-source: derived
      operationId: getV1Workspaces
      x-operation-id-source: derived
  /v1/workspaces/{workspaceId}:
    get:
      tags:
      - Workspaces
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/WorkspaceDto'
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDto'
            text/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDto'
      summary: Get workspaces by workspace id
      x-summary-source: derived
      operationId: getV1WorkspacesByWorkspaceId
      x-operation-id-source: derived
  /v1/workspaces/{workspaceId}/users:
    get:
      tags:
      - Workspaces
      summary: Get workspace users
      parameters:
      - name: workspaceId
        in: path
        description: The workspace ID
        required: true
        schema:
          type: integer
          format: int32
      - name: searchMask
        in: query
        description: Search by part of user name
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceUserDto'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceUserDto'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceUserDto'
      operationId: getV1WorkspacesByWorkspaceIdUsers
      x-operation-id-source: derived
    post:
      tags:
      - Workspaces
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/AddWorkspaceUserRequestDto'
          application/json:
            schema:
              $ref: '#/components/schemas/AddWorkspaceUserRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/AddWorkspaceUserRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AddWorkspaceUserRequestDto'
      responses:
        '200':
          description: OK
      summary: Create workspaces by workspace id users
      x-summary-source: derived
      operationId: postV1WorkspacesByWorkspaceIdUsers
      x-operation-id-source: derived
  /v1/workspaces/{workspaceId}/users/{userId}:
    delete:
      tags:
      - Workspaces
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
      summary: Delete workspaces by workspace id users by user id
      x-summary-source: derived
      operationId: deleteV1WorkspacesByWorkspaceIdUsersByUserId
      x-operation-id-source: derived
components:
  schemas:
    WorkspaceDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
        isPersonal:
          type: boolean
      additionalProperties: false
    AddWorkspaceUserRequestDto:
      type: object
      properties:
        userId:
          type: integer
          format: int32
        roleId:
          type: integer
          format: int32
      additionalProperties: false
    WorkspaceUserDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        email:
          type:
          - string
          - 'null'
        fullName:
          type:
          - string
          - 'null'
        roleId:
          type: integer
          format: int32
        roleName:
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    Access_Token:
      type: apiKey
      description: Authorization header with the Skyvia access token.
      name: Authorization
      in: header
