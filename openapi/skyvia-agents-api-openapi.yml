openapi: 3.2.0
info:
  title: Skyvia public Agents API
  version: v1
security:
- Access Token: []
tags:
- name: Agents
paths:
  /v1/workspaces/{workspaceId}/agents:
    get:
      tags:
      - Agents
      summary: Get agents
      parameters:
      - name: workspaceId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: skip
        in: query
        description: Items to skip [0...]
        schema:
          type: integer
          format: int32
          default: 0
      - name: take
        in: query
        description: Items to take [1..200]
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AgentDtoHasMorePagingDto'
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDtoHasMorePagingDto'
            text/json:
              schema:
                $ref: '#/components/schemas/AgentDtoHasMorePagingDto'
      operationId: getV1WorkspacesByWorkspaceIdAgents
      x-operation-id-source: derived
  /v1/workspaces/{workspaceId}/agents/{agentId}:
    get:
      tags:
      - Agents
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: agentId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AgentDto'
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDto'
            text/json:
              schema:
                $ref: '#/components/schemas/AgentDto'
      summary: Get workspaces by workspace id agents by agent id
      x-summary-source: derived
      operationId: getV1WorkspacesByWorkspaceIdAgentsByAgentId
      x-operation-id-source: derived
  /v1/workspaces/{workspaceId}/agents/{agentId}/test:
    post:
      tags:
      - Agents
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: agentId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiResult'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
      summary: Create workspaces by workspace id agents by agent id test
      x-summary-source: derived
      operationId: postV1WorkspacesByWorkspaceIdAgentsByAgentIdTest
      x-operation-id-source: derived
components:
  schemas:
    ApiResult:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
        refresh:
          type: boolean
      additionalProperties: false
    AgentDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
        key:
          type:
          - string
          - 'null'
      additionalProperties: false
    AgentDtoHasMorePagingDto:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AgentDto'
        hasMore:
          type: boolean
      additionalProperties: false
  securitySchemes:
    Access_Token:
      type: apiKey
      description: Authorization header with the Skyvia access token.
      name: Authorization
      in: header
