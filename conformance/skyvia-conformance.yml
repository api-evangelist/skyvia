method: searched
source: >-
  https://skyvia.com/security + openapi/_original/skyvia-public-api-openapi-original.json +
  live probes of api.skyvia.com and mcp.skyvia.com + security/skyvia-domain-security.yml
summary: >-
  Skyvia's conformance profile splits cleanly. On the COMPLIANCE side it is strong and independently
  attested — SOC 2 with audited controls, plus HIPAA, PCI DSS and GDPR posture published on its security
  page. On the TECHNICAL STANDARDS side it is thin: no OAuth, no OIDC, no RFC 9457 errors, no /.well-known
  discovery, no AsyncAPI. The two standards it does implement well are OData v4 (the entire Connect product)
  and MCP (the Connect MCP endpoint, though at a protocol revision several versions behind current).
standards:
- id: openapi-3.0
  conforms: true
  evidence: >-
    OpenAPI 3.0.1 document served publicly and unauthenticated at
    https://api.skyvia.com/swagger/v1/swagger.json (also .yaml), 47 paths / 52 operations, generated by
    Swashbuckle.
  quality_note: >-
    Valid but thin — no servers[] block, no operationIds on any operation, summaries on only 12 of 52
    operations, no descriptions, no examples, and no 4xx/5xx responses declared anywhere.
- id: odata-v4
  conforms: true
  evidence: >-
    Skyvia Connect publishes any connection as an OData v4 service consumable from Power BI, Excel, Tableau
    and generic OData clients. Documented at https://docs.skyvia.com/connect/odata-endpoints/.
- id: mcp
  conforms: true
  version: '2024-11-05'
  evidence: >-
    Live MCP server at https://mcp.skyvia.com/mcp answering initialize and tools/list over streamable HTTP
    (legacy /sse also served), advertising four tools with JSON Schema inputSchema blocks.
  deviations:
  - Protocol version 2024-11-05, several revisions behind the current MCP specification.
  - Non-standard `execution.taskSupport` and `_meta.category` keys on tool objects.
  - No MCP OAuth — neither /.well-known/oauth-authorization-server nor /.well-known/oauth-protected-resource is served (both 404).
- id: json-schema
  conforms: true
  evidence: MCP tool inputSchema blocks are JSON Schema; OpenAPI components.schemas carries 45 schemas.
- id: oauth2
  conforms: false
  evidence: >-
    No OAuth 2.0 anywhere. The Public API uses an opaque apiKey token in the Authorization header; Connect
    endpoints use optional HTTP Basic. No authorization-server metadata is served on any host.
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returns the marketing HTML shell on skyvia.com and 403 on api.skyvia.com.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Errors use a proprietary {errorCode, errors, message, refresh} envelope with content-type
