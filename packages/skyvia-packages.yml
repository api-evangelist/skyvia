summary: >-
  Skyvia publishes exactly one first-party client library to a public package registry: dotConnect for
  Skyvia Connect, a .NET ADO.NET provider from Devart that lets .NET code query a Skyvia Connect SQL
  endpoint. There is NO client SDK for the Skyvia Public REST management API in any language and on any
  registry — no npm, PyPI, Maven, RubyGems, Packagist, crates.io or Go module package exists for it; callers
  are expected to work from the Swagger document directly. The Skyvia Agent, the on-premise gateway, is a
  Windows installer distributed from the app, not a registry artifact.
