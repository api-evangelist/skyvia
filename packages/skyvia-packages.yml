related_but_not_first_party_clients:
- note: >-
    Skyvia Connect OData v4 endpoints are consumed by generic OData clients (Power BI, Excel, Tableau, any
    OData library). Those are third-party tools, not Skyvia packages, and are deliberately not listed here.
- note: >-
    The Skyvia Connectors SDK and the SDK Connector (June 2026) let a customer AUTHOR a connector — the
    Connectors SDK as JSON/REST connector configuration, the SDK Connector as custom .NET assemblies loaded
    by the Skyvia Agent. Both are extension points for building against Skyvia, not client libraries Skyvia
    publishes, and neither is distributed as a public registry package.
